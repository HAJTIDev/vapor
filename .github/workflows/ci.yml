name: CI / Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

  publish-windows:
    name: Publish Windows
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HAJTIDev/vapor.git

      - name: Build & publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: node scripts/publish.mjs

  publish-linux:
    name: Publish Linux
    runs-on: ubuntu-latest
    needs: publish-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest (get version bump from Windows job)
        run: git pull

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: sudo apt-get install -y rpm

      - name: Build & publish Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: node scripts/publish.mjs --linux --no-bump
