name: CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Encrypt keys & build
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapor-windows
          path: release/*.exe
          retention-days: 7

  build-linux:
    name: Build Linux (tar.gz + rpm)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install RPM build tools
        run: sudo apt-get install -y rpm

      - name: Encrypt keys & build
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vapor-linux
          path: |
            release/*.tar.gz
            release/*.rpm
          retention-days: 7
