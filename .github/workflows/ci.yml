name: CI / Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx vitest run

  build-windows:
    name: Build & Publish Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Encrypt keys & build
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vapor-windows
          path: release/*.exe
          retention-days: 7

      - name: Publish GitHub release (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: node scripts/publish.mjs --no-bump

  build-linux:
    name: Build & Publish Linux
    runs-on: ubuntu-latest
    needs: [test, build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: sudo apt-get install -y rpm

      - name: Encrypt keys & build
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: npm run build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vapor-linux
          path: |
            release/*.tar.gz
            release/*.rpm
          retention-days: 7

      - name: Publish GitHub release (Linux)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          VAPOR_ENCRYPTION_KEY: ${{ secrets.VAPOR_ENCRYPTION_KEY }}
        run: node scripts/publish.mjs --linux --no-bump
